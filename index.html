<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Dilshad Ali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
:root { --bg: #fafaf7; --fg: #0b0b0c; --muted: #5b5b60; --line: #e4e4de; --accent: #4d6b00; --mark: #c8f04b; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --fg: #f2f2ee; --muted: #a3a3a8; --line: #26262a; --accent: #c8f04b; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.65 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 48px 16px 80px; }
h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 8px; }
h1 span { background: linear-gradient(transparent 62%, var(--mark) 62%); }
h2 { font-size: 20px; margin: 40px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
p, li { color: var(--fg); }
ul { padding-left: 20px; }
li { margin: 6px 0; }
a { color: var(--accent); overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 15px; margin: 0 0 32px; }
footer { color: var(--muted); font-size: 14px; margin-top: 48px; }
</style>
</head>
<body>
<main>
<h1>Apps by <span>Dilshad Ali</span></h1>
<p class="meta">Privacy policies</p>
<ul>
  <li><a href="peek-qr/privacy-policy/">Peek QR privacy policy</a></li>
  <li><a href="serial-hunt/privacy-policy/">Serial Hunt privacy policy</a></li>
</ul>
<footer>Dilshad Ali</footer>
</main>
</body>
</html>
